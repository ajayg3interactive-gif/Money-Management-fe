<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px)"
  (click)="close()"
>
  <!-- Dialog -->
  <div
    class="w-full bg-surface rounded-2xl flex flex-col"
    style="max-width: 480px; max-height: 80vh; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18)"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 pt-6 pb-2">
      <h2 class="text-text" style="font-size: 17px; font-weight: 700; margin: 0 0 8px">
        {{ title }}
      </h2>
      <p class="text-text-muted" style="font-size: 13.5px; margin: 0; line-height: 1.5">
        Fix the issues below in your CSV file and try importing again. Nothing was imported.
      </p>
    </div>

    <div class="px-6 py-3" style="overflow-y: auto; flex: 1">
      <ul class="flex flex-col gap-2">
        @for (error of errors; track $index) {
          <li
            class="text-text rounded-lg px-3 py-2"
            style="font-size: 13px; background: color-mix(in srgb, #ef4444, transparent 92%); border: 1px solid color-mix(in srgb, #ef4444, transparent 75%)"
          >
            {{ error }}
          </li>
        }
      </ul>
    </div>

    <div class="flex items-center gap-3 px-6 pb-6 pt-4">
      <button
        (click)="close()"
        class="flex-1 py-3 rounded-xl text-white text-sm font-semibold transition-all active:scale-99"
        style="
          background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
          box-shadow: 0 2px 8px color-mix(in srgb, var(--primary), transparent 65%);
        "
      >
        Close
      </button>
    </div>
  </div>
</div>
