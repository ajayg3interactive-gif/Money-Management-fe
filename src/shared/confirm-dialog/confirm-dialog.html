<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px)"
  (click)="cancel()"
>
  <!-- Dialog -->
  <div
    class="w-full bg-surface rounded-2xl flex flex-col"
    style="max-width: 380px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18)"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 pt-6 pb-2">
      <h2 class="text-text" style="font-size: 17px; font-weight: 700; margin: 0 0 8px">
        {{ title }}
      </h2>
      <p class="text-text-muted" style="font-size: 13.5px; margin: 0; line-height: 1.5">
        {{ message }}
      </p>
    </div>

    <div class="flex items-center gap-3 px-6 pb-6 pt-4">
      <button
        (click)="cancel()"
        class="flex-1 py-3 rounded-xl text-sm font-semibold transition-all active:scale-99 text-text-muted bg-surface"
        style="border: 1.5px solid var(--border)"
      >
        {{ cancelLabel }}
      </button>
      <button
        (click)="confirm()"
        class="flex-1 py-3 rounded-xl text-white text-sm font-semibold transition-all active:scale-99"
        style="background: #ef4444; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35)"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
