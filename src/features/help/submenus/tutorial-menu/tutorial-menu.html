<div>
  <h2 class="text-xl font-bold text-gray-900">Tutorial</h2>
  <p class="text-sm text-gray-500 mt-1 mb-4">
    Rerun a guided walkthrough of any page, any time.
  </p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    @for (item of tutorials; track item.tourId) {
      <div
        class="rounded-2xl p-5 flex flex-col gap-3"
        style="border: 1px solid #f1f5f9; background: #f8fafc"
      >
        <div class="flex items-center gap-3">
          <span class="flex items-center justify-center w-10 h-10 rounded-full bg-indigo-100 text-indigo-600">
            <app-icon [name]="item.icon" [size]="20"></app-icon>
          </span>
          <h3 class="font-semibold text-gray-900">{{ item.label }}</h3>
        </div>
        <p class="text-sm text-gray-500 leading-relaxed flex-1">{{ item.description }}</p>
        <button
          type="button"
          (click)="startTutorial(item)"
          class="flex items-center justify-center gap-2 self-start bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold py-2.5 px-6 rounded-xl transition-all active:scale-99 duration-200  hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          <app-icon name="tutorialIcon" [size]="16"></app-icon>
          Start Tour
        </button>
      </div>
    }
  </div>
</div>
