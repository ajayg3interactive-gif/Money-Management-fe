<div>
  <h2 class="text-xl font-bold text-text">Tutorial</h2>
  <p class="text-sm text-text-muted mt-1 mb-4">
    Rerun a guided walkthrough of any page, any time.
  </p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    @for (item of tutorials; track item.tourId) {
      <div
        class="rounded-2xl p-5 flex flex-col gap-3 border border-border bg-background"
      >
        <div class="flex items-center gap-3">
          <span class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary">
            <app-icon [name]="item.icon" [size]="20"></app-icon>
          </span>
          <h3 class="font-semibold text-text">{{ item.label }}</h3>
        </div>
        <p class="text-sm text-text-muted leading-relaxed flex-1">{{ item.description }}</p>
        <button
          type="button"
          (click)="startTutorial(item)"
          class="flex items-center justify-center gap-2 self-start bg-primary hover:opacity-90 active:opacity-80 disabled:opacity-60 disabled:cursor-not-allowed text-on-primary font-semibold py-2.5 px-6 rounded-xl transition-all active:scale-99 duration-200 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary/40 focus:ring-offset-2"
        >
          <app-icon name="tutorialIcon" [size]="16"></app-icon>
          Start Tour
        </button>
      </div>
    }
  </div>
</div>
