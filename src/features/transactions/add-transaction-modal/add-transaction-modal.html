<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px)"
>
  <!-- Modal -->
  <div
    class="w-full bg-surface rounded-2xl flex flex-col"
    style="max-width: 440px; max-height: 90vh; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18)"
  >
    <!-- Header -->
    <div
      class="flex items-center justify-between px-6 py-5 shrink-0 border-border"
      style="border-bottom: 1px solid"
    >
      <div>
        <h2 class="text-text" style="font-size: 17px; font-weight: 700; margin: 0 0 3px">
          Add Transaction
        </h2>
        <p class="text-text-muted" style="font-size: 12px; margin: 0">Record a new income or expense</p>
      </div>
      <button
        (click)="closeModal()"
        class="flex items-center justify-center rounded-full transition-all text-text-muted"
        style="width: 32px; height: 32px; background: transparent"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Scrollable body -->
    <div class="flex-1 overflow-y min-h-0">
    <!-- Type Toggle -->
    <div class="px-6 pt-5">
      <div class="flex gap-2 p-1 rounded-xl bg-background">
        <button
          class="flex-1 py-2 rounded-lg text-sm font-semibold text-white transition-all"
          [style]="
            type() === 'Expense'
              ? 'background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%)'
              : 'color: var(--text-muted)'
          "
          (click)="setType('Expense')"
        >
          Expense
        </button>
        <button
          class="flex-1 py-2 rounded-lg text-sm font-semibold text-white transition-all"
          [style]="
            type() === 'Income'
              ? 'background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%)'
              : 'color: var(--text-muted)'
          "
          (click)="setType('Income')"
        >
          Income
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="px-6 pt-5 pb-2" style="display: flex; flex-direction: column; gap: 16px">
      <!-- Amount -->
      <div>
        <label
          style="
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 8px;
          "
        >
          Amount
        </label>
        <div
          class="flex items-center gap-2 rounded-xl px-4 py-3 transition-all"
          style="border: 1.5px solid var(--border); background: var(--background)"
        >
          <span style="color: var(--text-muted); font-size: 14px; font-weight: 600; user-select: none"
            >{{ authService.currencySymbol() }}</span
          >
          <input
            type="number"
            placeholder="0"
            class="no-spinner"
            [ngModel]="amount()"
            (ngModelChange)="amount.set($event)"
            style="
              flex: 1;
              background: transparent;
              border: none;
              outline: none;
              font-size: 22px;
              font-weight: 700;
              color: var(--text);
            "
          />
        </div>
      </div>

      <!-- Category + Date -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label
            style="
              display: block;
              font-size: 11px;
              font-weight: 600;
              color: var(--text-muted);
              letter-spacing: 0.07em;
              text-transform: uppercase;
              margin-bottom: 8px;
            "
          >
            Category
          </label>
          <app-category-dropdown
            [categories]="categories()"
            [value]="category()"
            (valueChange)="category.set($event)"
          ></app-category-dropdown>
        </div>
        <div>
          <label
            style="
              display: block;
              font-size: 11px;
              font-weight: 600;
              color: var(--text-muted);
              letter-spacing: 0.07em;
              text-transform: uppercase;
              margin-bottom: 8px;
            "
          >
            Date
          </label>
          <app-date-picker
            [value]="date()"
            (valueChange)="date.set($event)"
          ></app-date-picker>
        </div>
      </div>

      <!-- Description -->
      <div>
        <label
          style="
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 8px;
          "
        >
          Description
          <span class="text-text-muted" style="font-weight: 400; text-transform: none; letter-spacing: 0"
            >&nbsp;(optional)</span
          >
        </label>
        <textarea
          placeholder="What was this transaction for?"
          rows="3"
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
          style="
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-size: 13.5px;
            color: var(--text);
            background: var(--background);
            outline: none;
            resize: none;
            font-family: inherit;
          "
        ></textarea>
      </div>
    </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center gap-3 px-6 pb-6 pt-2 shrink-0">
      <button
        (click)="closeModal()"
        class="flex-1 py-3 rounded-xl text-sm font-semibold transition-all active:scale-99 text-text-muted bg-surface"
        style="border: 1.5px solid var(--border)"
      >
        Cancel
      </button>
      <button
        class="flex-1 py-3 rounded-xl text-white text-sm font-semibold transition-all active:scale-99"
        style="
          background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
          box-shadow: 0 2px 8px color-mix(in srgb, var(--primary), transparent 65%);
        "
        (click)="handleSave()"
      >
        {{ isEditMode() ? 'Update' : 'Save' }}
      </button>
    </div>
  </div>
</div>
